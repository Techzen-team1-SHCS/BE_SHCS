name: Laravel CI

on:
  push:
    branches: [ "dev" ]      # chạy CI khi push lên nhánh dev
  pull_request:
    branches: [ "dev" ]      # hoặc khi tạo PR vào dev

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'   # đổi theo version PHP dự án bạn
          extensions: mbstring, bcmath, intl, pdo, sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Set directory permissions
        run: chmod -R 777 storage bootstrap/cache

      # Dùng SQLite in memory cho CI test
      - name: Run migrations (SQLite in memory)
        run: php artisan migrate --force --env=testing

      - name: Run tests
        run: php artisan test
